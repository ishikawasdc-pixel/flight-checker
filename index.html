<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム最安航空券チェッカー</title>
  <style>
    :root {
      --bg-color: #0d1b2a;
      --card-bg: #1b263b;
      --accent-color: #00b4d8;
      --text-color: #e0e1dd;
      --highlight: #ff4d6d;
      --sub-text: #94a3b8;
    }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      color: var(--accent-color);
      margin-bottom: 5px;
      font-size: 1.8rem;
    }

    .updated-at {
      font-size: 0.85rem;
      color: var(--sub-text);
    }

    .search-box {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.85rem;
      margin-bottom: 5px;
      color: var(--accent-color);
    }

    select, input, button {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #415a77;
      background: #0d1b2a;
      color: #fff;
      font-size: 0.95rem;
    }

    button {
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
      align-self: flex-end;
      height: 42px;
    }

    button:hover {
      background: #90e0ef;
    }

    .results {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .summary-card {
      background: var(--card-bg);
      border-left: 5px solid var(--accent-color);
      padding: 15px 20px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .price-tag {
      font-size: 1.5rem;
      color: var(--highlight);
      font-weight: bold;
    }

    .flight-section-title {
      font-size: 1.1rem;
      margin: 15px 0 10px 0;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .flight-card {
      background: var(--card-bg);
      padding: 12px 20px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #2b3a4e;
    }

    .airline-name {
      font-weight: bold;
      font-size: 1.05rem;
      width: 120px;
    }

    .flight-details {
      text-align: center;
      flex-grow: 1;
    }

    .flight-airport {
      font-size: 0.8rem;
      color: #70e000;
      margin-bottom: 3px;
    }

    .flight-time {
      font-size: 1rem;
      color: #fff;
      font-weight: bold;
    }

    .flight-price {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--text-color);
    }

    .btn-select {
      background: #0077b6;
      color: white;
      padding: 6px 12px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>✈️ 航空券リアルタイム最安チェッカー</h1>
      <div class="updated-at" id="updated-at">データロード中...</div>
    </header>

    <div class="search-box">
      <div class="form-group">
        <label>出発地 ➔ 目的地</label>
        <select id="route-select">
          <option value="OSA-OKA">大阪 (関空・伊丹) ➔ 沖縄 (那覇)</option>
          <option value="TYO-OKA">東京 (羽田・成田) ➔ 沖縄 (那覇)</option>
          <option value="TYO-FUK">東京 (羽田・成田) ➔ 福岡</option>
          <option value="TYO-CTS">東京 (羽田・成田) ➔ 札幌 (新千歳)</option>
        </select>
      </div>

      <div class="form-group">
        <label>出発日（行き）</label>
        <select id="date-select"></select>
      </div>

      <button id="search-btn">最安値を検索</button>
    </div>

    <div class="results" id="results-container">
      <!-- 検索結果がここに表示されます -->
    </div>
  </div>

  <script>
    let globalData = null;

    async function loadData() {
      try {
        const response = await fetch('data.json?t=' + new Date().getTime());
        globalData = await response.json();
        
        document.getElementById('updated-at').textContent = `最終更新: ${globalData.updated_at}`;
        
        populateDates();
        renderResults();
      } catch (e) {
        document.getElementById('updated-at').textContent = 'データの読み込みに失敗しました。';
      }
    }

    function populateDates() {
      const dateSelect = document.getElementById('date-select');
      dateSelect.innerHTML = '';

      const dates = [...new Set(globalData.schedules.map(s => s.outbound_date))];
      dates.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d;
        dateSelect.appendChild(opt);
      });
    }

    function renderResults() {
      const routeId = document.getElementById('route-select').value;
      const selectedDate = document.getElementById('date-select').value;
      const container = document.getElementById('results-container');
      container.innerHTML = '';

      const match = globalData.schedules.find(s => s.id === routeId && s.outbound_date === selectedDate);

      if (!match) {
        container.innerHTML = '<p style="text-align:center;">指定した条件のデータが見つかりませんでした。</p>';
        return;
      }

      // サマリーヘッダー
      const summaryHtml = `
        <div class="summary-card">
          <div>
            <h2 style="margin:0; font-size:1.2rem;">${match.route_name}</h2>
            <div style="font-size:0.85rem; color:var(--sub-text); margin-top:5px;">
              日程: 行き ${match.outbound_date} ／ 帰り ${match.inbound_date}
            </div>
          </div>
          <div>
            <div style="font-size:0.8rem; color:var(--sub-text); text-align:right;">往復最安値</div>
            <div class="price-tag">${match.total_min_price.toLocaleString()} 円</div>
          </div>
        </div>
      `;

      // 往路（行き）リスト
      let outFlightsHtml = `<div class="flight-section-title">✈️ 行き (往路) 便一覧</div>`;
      match.outbound_flights.forEach(f => {
        outFlightsHtml += `
          <div class="flight-card">
            <div class="airline-name">${f.flight_num}</div>
            <div class="flight-details">
              <div class="flight-airport">📍 ${f.airport || '直行便'}</div>
              <div class="flight-time">${f.time}</div>
            </div>
            <div class="flight-price">${f.price.toLocaleString()} 円</div>
            <button class="btn-select" onclick="alert('${f.flight_num} (${f.airport}) ${f.price.toLocaleString()}円を選択しました')">選択</button>
          </div>
        `;
      });

      // 復路（帰り）リスト
      let inFlightsHtml = `<div class="flight-section-title" style="margin-top:25px;">✈️ 帰り (復路) 便一覧</div>`;
      match.inbound_flights.forEach(f => {
        inFlightsHtml += `
          <div class="flight-card">
            <div class="airline-name">${f.flight_num}</div>
            <div class="flight-details">
              <div class="flight-airport">📍 ${f.airport || '直行便'}</div>
              <div class="flight-time">${f.time}</div>
            </div>
            <div class="flight-price">${f.price.toLocaleString()} 円</div>
            <button class="btn-select" onclick="alert('${f.flight_num} (${f.airport}) ${f.price.toLocaleString()}円を選択しました')">選択</button>
          </div>
        `;
      });

      container.innerHTML = summaryHtml + outFlightsHtml + inFlightsHtml;
    }

    document.getElementById('search-btn').addEventListener('click', renderResults);
    document.getElementById('route-select').addEventListener('change', renderResults);

    loadData();
  </script>
</body>
</html>
