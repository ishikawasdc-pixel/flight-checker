<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>格安移動手段一括検索</title>
    <style>
        :root {
            --bg-dark: #07192f;
            --card-bg: #0b223d;
            --accent-blue: #0066ff;
            --accent-hover: #0052cc;
            --text-main: #ffffff;
            --text-sub: #a0aec0;
            --border-color: #1e3a5f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding-bottom: 50px;
        }

        .hero {
            background: linear-gradient(180deg, #051329 0%, #0a2540 100%);
            padding: 40px 20px 30px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .tab-btn.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        .search-box-wrapper {
            background: #ffffff;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: row;
            align-items: flex-end;
            gap: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            color: #333;
            width: 100%;
        }

        @media (max-width: 768px) {
            .search-box-wrapper {
                flex-direction: column;
                align-items: stretch;
            }
        }

        .search-field {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }

        .search-field label {
            font-size: 11px;
            font-weight: 700;
            color: #666;
            margin-bottom: 4px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .search-field select {
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 10px 6px;
            font-size: 13px;
            font-weight: 600;
            color: #1a202c;
            background-color: #f8fafc;
            outline: none;
            cursor: pointer;
            width: 100%;
            text-overflow: ellipsis;
        }

        /* 反転ボタンのスタイル */
        .swap-btn-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            padding-bottom: 2px;
        }

        .swap-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            color: #475569;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .swap-btn:hover {
            background: var(--accent-blue);
            color: #ffffff;
            border-color: var(--accent-blue);
            transform: rotate(180deg);
        }

        @media (max-width: 768px) {
            .swap-btn-wrapper {
                padding: 4px 0;
            }
            .swap-btn:hover {
                transform: rotate(90deg);
            }
        }

        .search-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            height: 41px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .search-btn:hover {
            background: var(--accent-hover);
        }

        .sub-options {
            display: flex;
            gap: 20px;
            margin-top: 14px;
            font-size: 13px;
            color: var(--text-sub);
        }

        .sub-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto 0;
            padding: 0 20px;
        }

        .section-header {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .summary-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .summary-info h3 {
            font-size: 18px;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .summary-info p {
            font-size: 14px;
            color: var(--text-sub);
        }

        .price-tag {
            text-align: right;
        }

        .price-tag span {
            font-size: 26px;
            font-weight: 800;
            color: #ff4d4f;
        }

        .flight-section-title {
            font-size: 16px;
            color: var(--text-sub);
            margin: 20px 0 10px;
            font-weight: 600;
        }

        .flight-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s, transform 0.1s;
        }

        .flight-card:hover {
            border-color: var(--accent-blue);
            transform: translateY(-2px);
        }

        .airline-badge {
            font-weight: 700;
            font-size: 16px;
            color: var(--text-main);
            width: 120px;
        }

        .flight-time-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .flight-num {
            font-weight: 700;
            font-size: 14px;
            color: var(--accent-blue);
        }

        .flight-time {
            font-size: 16px;
            font-weight: 600;
        }

        .flight-price-box {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .flight-price {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
        }

        .select-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        .no-data-msg {
            background: var(--card-bg);
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            padding: 50px 20px;
            text-align: center;
            color: var(--text-sub);
            font-size: 15px;
            line-height: 1.8;
        }

        .footer-updated {
            text-align: right;
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="hero">
        <div class="nav-tabs">
            <button class="tab-btn active" id="tab-flight" onclick="changeTab('flight')">✈️ 航空券</button>
            <button class="tab-btn" id="tab-train" onclick="changeTab('train')">🚆 鉄道路線</button>
            <button class="tab-btn" id="tab-bus" onclick="changeTab('bus')">🚌 バス路線</button>
        </div>

        <h1 class="title" id="page-title">無数にある格安航空券をすばやく一括検索。</h1>

        <!-- 検索バー -->
        <div class="search-box-wrapper" id="search-box">
            <div class="search-field">
                <label>出発地</label>
                <select id="origin-select">
                    <option value="大阪 (OSA)">大阪 (OSA)</option>
                    <option value="東京 (TYO)">東京 (TYO)</option>
                    <option value="沖縄 (OKA)">沖縄 (OKA)</option>
                    <option value="福岡 (FUK)">福岡 (FUK)</option>
                    <option value="札幌 (CTS)">札幌 (CTS)</option>
                </select>
            </div>

            <!-- 反転ボタン -->
            <div class="swap-btn-wrapper">
                <button class="swap-btn" onclick="swapLocations()" title="出発地と目的地を反転">⇄</button>
            </div>

            <div class="search-field">
                <label>目的地</label>
                <select id="destination-select">
                    <option value="沖縄 (OKA)">沖縄 (OKA)</option>
                    <option value="福岡 (FUK)">福岡 (FUK)</option>
                    <option value="東京 (TYO)">東京 (TYO)</option>
                    <option value="大阪 (OSA)">大阪 (OSA)</option>
                    <option value="札幌 (CTS)">札幌 (CTS)</option>
                </select>
            </div>
            <div class="search-field">
                <label>往路日（行き）</label>
                <select id="date-select"></select>
            </div>
            <div class="search-field" id="return-date-field">
                <label>復路日（帰り）</label>
                <select id="return-date-select"></select>
            </div>
            <div class="search-field">
                <label>航空会社</label>
                <select id="airline-select">
                    <option value="ALL">すべて</option>
                    <option value="ANA">ANA</option>
                    <option value="JAL">JAL</option>
                </select>
            </div>
            <button class="search-btn" onclick="executeSearch()">検索</button>
        </div>

        <div class="sub-options" id="sub-options">
            <label><input type="checkbox" checked disabled> 直行便のみ</label>
            <label><input type="checkbox" id="is-roundtrip" checked onchange="toggleRoundTrip()"> 往復</label>
            <label><input type="checkbox" disabled> エコノミー</label>
        </div>
    </div>

    <div class="container">
        <div class="section-header">
            <span id="results-title">検索結果</span>
        </div>

        <div id="results-area"></div>

        <div class="footer-updated">データ最終更新: <span id="updated-at">-</span></div>
    </div>

    <script>
        let globalData = null;
        let currentTab = 'flight';

        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                globalData = data;
                document.getElementById('updated-at').innerText = data.updated_at || '-';
                
                initDateSelects(data.schedules || []);
                toggleRoundTrip();
                executeSearch();
            })
            .catch(err => {
                console.error("データ読み込みエラー:", err);
                initDateSelects([]);
            });

        // 日付セレクトボックスの初期化（データが空でも自動補完）
        function initDateSelects(schedules) {
            let outboundDates = [...new Set(schedules.map(s => s.outbound_date))].filter(Boolean);
            let inboundDates = [...new Set(schedules.map(s => s.inbound_date))].filter(Boolean);

            // 万が一データが空だった場合は未来の日付を自動設定して枠が空にならないようにする
            if (outboundDates.length === 0) {
                const today = new Date();
                today.setDate(today.getDate() + 30);
                outboundDates = [today.toISOString().split('T')[0]];
            }
            if (inboundDates.length === 0) {
                const today = new Date();
                today.setDate(today.getDate() + 33);
                inboundDates = [today.toISOString().split('T')[0]];
            }

            const dateSelect = document.getElementById('date-select');
            const returnDateSelect = document.getElementById('return-date-select');

            dateSelect.innerHTML = outboundDates.map(d => `<option value="${d}">${d}</option>`).join('');
            returnDateSelect.innerHTML = inboundDates.map(d => `<option value="${d}">${d}</option>`).join('');
        }

        // 出発地と目的地の反転処理
        function swapLocations() {
            const originSelect = document.getElementById('origin-select');
            const destSelect = document.getElementById('destination-select');

            const temp = originSelect.value;
            originSelect.value = destSelect.value;
            destSelect.value = temp;

            executeSearch();
        }

        function changeTab(type) {
            currentTab = type;
            
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${type}`).classList.add('active');

            const pageTitle = document.getElementById('page-title');
            const searchBox = document.getElementById('search-box');
            const subOptions = document.getElementById('sub-options');
            const resultsArea = document.getElementById('results-area');

            if (type === 'flight') {
                pageTitle.innerText = "無数にある格安航空券をすばやく一括検索。";
                searchBox.style.display = 'flex';
                subOptions.style.display = 'flex';
                executeSearch();
            } else if (type === 'train') {
                pageTitle.innerText = "全国の新幹線・特急列車のルートと料金を一括比較。";
                searchBox.style.display = 'none';
                subOptions.style.display = 'none';
                resultsArea.innerHTML = `
                    <div class="no-data-msg">
                        🚆 <strong>鉄道路線検索機能は現在準備中です</strong><br>
                        新幹線やJR各線の時刻表・料金比較に対応予定です。
                    </div>
                `;
            } else if (type === 'bus') {
                pageTitle.innerText = "全国の高速バス・夜行バスの最安値を一括検索。";
                searchBox.style.display = 'none';
                subOptions.style.display = 'none';
                resultsArea.innerHTML = `
                    <div class="no-data-msg">
                        🚌 <strong>バス路線検索機能は現在準備中です</strong><br>
                        全国の高速バス・夜行バスルートに対応予定です。
                    </div>
                `;
            }
        }

        function toggleRoundTrip() {
            const isRoundTrip = document.getElementById('is-roundtrip').checked;
            const returnDateField = document.getElementById('return-date-field');

            if (isRoundTrip) {
                returnDateField.style.display = 'flex';
            } else {
                returnDateField.style.display = 'none';
            }
        }

        function executeSearch() {
            if (!globalData || currentTab !== 'flight') return;

            const origin = document.getElementById('origin-select').value;
            const destination = document.getElementById('destination-select').value;
            const selectedDate = document.getElementById('date-select').value;
            const selectedAirline = document.getElementById('airline-select').value;
            const isRoundTrip = document.getElementById('is-roundtrip').checked;

            const matchedSchedules = (globalData.schedules || []).filter(item => {
                const matchRoute = item.route_name.includes(origin) && item.route_name.includes(destination);
                const matchDate = item.outbound_date === selectedDate;
                const matchAirline = selectedAirline === 'ALL' || item.airline === selectedAirline;
                return matchRoute && matchDate && matchAirline;
            });

            const resultsArea = document.getElementById('results-area');
            resultsArea.innerHTML = '';

            if (matchedSchedules.length === 0) {
                resultsArea.innerHTML = `
                    <div class="no-data-msg">
                        ⚠️ 指定された条件（${origin} ➔ ${destination} / ${selectedDate}）に該当する航空券が見つかりませんでした。<br>
                        条件を変更して再度検索してください。
                    </div>
                `;
                return;
            }

            matchedSchedules.forEach(item => {
                const itemContainer = document.createElement('div');
                itemContainer.style.marginBottom = '40px';

                let outboundCards = item.outbound_flights.map(f => `
                    <div class="flight-card">
                        <div class="airline-badge">${f.flight_num || item.airline}</div>
                        <div class="flight-time-info">
                            <span class="flight-num">直行便</span>
                            <span class="flight-time">${f.time}</span>
                        </div>
                        <div class="flight-price-box">
                            <span class="flight-price">${f.price.toLocaleString()} 円</span>
                            <button class="select-btn">選択</button>
                        </div>
                    </div>
                `).join('');

                let inboundCards = item.inbound_flights.map(f => `
                    <div class="flight-card">
                        <div class="airline-badge">${f.flight_num || item.airline}</div>
                        <div class="flight-time-info">
                            <span class="flight-num">直行便</span>
                            <span class="flight-time">${f.time}</span>
                        </div>
                        <div class="flight-price-box">
                            <span class="flight-price">${f.price.toLocaleString()} 円</span>
                            <button class="select-btn">選択</button>
                        </div>
                    </div>
                `).join('');

                const minOutbound = Math.min(...item.outbound_flights.map(f => f.price));
                const priceLabel = isRoundTrip ? '往復最安値' : '片道最安値';
                const displayPrice = isRoundTrip ? item.total_min_price : minOutbound;

                let returnSection = '';
                if (isRoundTrip) {
                    returnSection = `
                        <div class="flight-section-title">✈️ 帰り（復路）便一覧</div>
                        ${inboundCards}
                    `;
                }

                itemContainer.innerHTML = `
                    <div class="summary-card">
                        <div class="summary-info">
                            <h3>${item.route_name}</h3>
                            <p>日程: 行き ${item.outbound_date} ${isRoundTrip ? '／ 帰り ' + item.inbound_date : ''}</p>
                        </div>
                        <div class="price-tag">
                            <p style="font-size:12px; color:var(--text-sub);">${priceLabel}</p>
                            <span>${displayPrice.toLocaleString()} 円</span>
                        </div>
                    </div>

                    <div class="flight-section-title">✈️ 行き（往路）便一覧</div>
                    ${outboundCards}

                    ${returnSection}
                `;

                resultsArea.appendChild(itemContainer);
            });
        }
    </script>
</body>
</html>
