name: Flight Price Checker Page

on:
  schedule:
    - cron: '0 0 * * *' # 毎日日本時間 9:00 に自動更新
  workflow_dispatch:     # 手動実行ボタン

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: スクリプト実行（データ更新）
        run: python main.py

      - name: 更新されたデータを保存
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update price data" && git push)
