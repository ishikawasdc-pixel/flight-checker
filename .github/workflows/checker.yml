name: Flight Price Checker

on:
  schedule:
    # 毎日日本時間の朝9:00（UTC 0:00）に実行
    - cron: '0 0 * * *'
  # 手動実行用ボタンを表示
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - name: コードを取得
      uses: actions/checkout@v4

    - name: Pythonをセットアップ
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 必要なライブラリをインストール
      run: pip install requests

    - name: スクリプト実行
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python main.py
