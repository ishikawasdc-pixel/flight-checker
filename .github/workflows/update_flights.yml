name: Google Flights Auto Update

on:
  schedule:
    # 毎日 朝 8:00 (JST) に自動実行 (UTC 23:00)
    - cron: '0 23 * * *'
  workflow_dispatch: # 手動実行ボタンも有効化

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: 1. リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: 2. Python 環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 4. Googleフライト取得スクリプト (main.py) の実行
        run: python main.py

      - name: 5. 変更された data.json を自動コミット＆プッシュ
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json
          git diff-index --quiet HEAD || git commit -m "Auto update: Google Flights data [skip ci]"
          git push
