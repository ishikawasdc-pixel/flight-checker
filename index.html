<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マルチ航空券価格チェッカー</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #004098; font-size: 24px; border-bottom: 2px solid #004098; padding-bottom: 10px; margin-top: 0; }
        .filter-box { background: #f0f4f8; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .filter-box label { font-weight: bold; margin-right: 10px; }
        .filter-box select { padding: 8px 12px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; width: 100%; max-width: 400px; }
        .info-card { background: #eef5ff; border-left: 5px solid #004098; padding: 15px; margin-bottom: 20px; border-radius: 4px; }
        .price-badge { font-size: 20px; font-weight: bold; color: #d9534f; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #555; }
        .section-title { margin-top: 25px; font-size: 18px; color: #004098; font-weight: bold; }
        .last-updated { font-size: 12px; color: #888; text-align: right; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>✈️ 航空券リアルタイム比較デモ</h1>
        
        <!-- プルダウン選択エリア -->
        <div class="filter-box">
            <label for="schedule-select">🔍 検索条件を選択:</label><br><br>
            <select id="schedule-select" onchange="changeSchedule()"></select>
        </div>

        <div class="info-card">
            <p><strong>【路線】</strong> <span id="route">-</span></p>
            <p><strong>【航空会社】</strong> <span id="airline">-</span></p>
            <p><strong>【日程】</strong> 行き: <span id="outbound-date">-</span> ／ 帰り: <span id="inbound-date">-</span></p>
            <p><strong>【往復最安値】</strong> <span class="price-badge" id="total-min-price">-</span></p>
        </div>

        <div class="section-title">✈️ 行き（往路）</div>
        <table>
            <thead><tr><th>便名</th><th>時間</th><th>価格</th></tr></thead>
            <tbody id="outbound-table"></tbody>
        </table>

        <div class="section-title">✈️ 帰り（復路）</div>
        <table>
            <thead><tr><th>便名</th><th>時間</th><th>価格</th></tr></thead>
            <tbody id="inbound-table"></tbody>
        </table>

        <div class="last-updated">最終更新日時: <span id="updated-at">-</span></div>
    </div>

    <script>
        let globalData = null;

        // data.jsonの読み込み
        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                globalData = data;
                document.getElementById('updated-at').innerText = data.updated_at;

                const select = document.getElementById('schedule-select');
                select.innerHTML = '';

                // プルダウンに選択肢を追加
                data.schedules.forEach((item, index) => {
                    const opt = document.createElement('option');
                    opt.value = index;
                    opt.innerText = `[${item.airline}] ${item.route_name} (${item.outbound_date}発)`;
                    select.appendChild(opt);
                });

                // 初期表示（1件目）
                updateDisplay(0);
            });

        // プルダウン切り替え時の処理
        function changeSchedule() {
            const index = document.getElementById('schedule-select').value;
            updateDisplay(index);
        }

        // 画面切り替え表示ロジック
        function updateDisplay(index) {
            const item = globalData.schedules[index];
            document.getElementById('route').innerText = item.route_name;
            document.getElementById('airline').innerText = item.airline;
            document.getElementById('outbound-date').innerText = item.outbound_date;
            document.getElementById('inbound-date').innerText = item.inbound_date;
            document.getElementById('total-min-price').innerText = item.total_min_price.toLocaleString() + ' 円';

            const renderTable = (targetId, flights) => {
                const tbody = document.getElementById(targetId);
                tbody.innerHTML = '';
                flights.forEach(f => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td><strong>${f.flight_num}</strong></td><td>${f.time}</td><td><strong>${f.price.toLocaleString()} 円</strong></td>`;
                    tbody.appendChild(tr);
                });
            };

            renderTable('outbound-table', item.outbound_flights);
            renderTable('inbound-table', item.inbound_flights);
        }
    </script>
</body>
</html>
